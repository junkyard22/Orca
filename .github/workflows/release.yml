name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.6)'
        required: true
        default: 'v1.2.6'

jobs:
  build-desktop:
    name: Build Desktop Installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Same reason as ci.yml: Contract Check resolves a base ref to diff
          # against, and the default shallow clone has none — so the strict
          # check below reported CLEAR unconditionally, exactly the no-op it was
          # fixed for on the PR path.  It is not redundant here: a tag cut from
          # somewhere other than main (a hotfix, say) is precisely the case that
          # never went through the PR gate.
          fetch-depth: 0

      # No `version:` here on purpose — action-setup reads the `packageManager`
      # field in package.json, so the release always uses the same pnpm that
      # generated the lockfile.  This previously pinned `version: 9` while
      # package.json declared pnpm@10.30.2, which action-setup rejects outright:
      # "Multiple versions of pnpm specified".  ci.yml already omits it; this
      # file was missed.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict Contract Check
        run: pnpm contract:check:strict

      - name: Build packages
        run: pnpm --filter './packages/**' build

      - name: Build desktop installer and portable
        run: pnpm --filter @clawde/desktop dist

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: desktop-windows
          # Only the two user-facing executables — no blockmaps, no unpacked dir
          path: |
            apps/desktop/release/Orca Setup *.exe
            apps/desktop/release/Orca *.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v8
        with:
          name: desktop-windows
          path: release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-assets/*.exe
          generate_release_notes: true
