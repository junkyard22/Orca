name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v1.2.6)'
        required: true
        default: 'v1.2.6'

jobs:
  build-desktop:
    name: Build Desktop Installers
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict Contract Check
        run: pnpm contract:check:strict

      - name: Build packages
        run: pnpm --filter './packages/**' build

      - name: Build desktop installer and portable
        run: pnpm --filter @clawde/desktop dist

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: desktop-windows
          # Only the two user-facing executables — no blockmaps, no unpacked dir
          path: |
            apps/desktop/release/Orca Setup *.exe
            apps/desktop/release/Orca *.exe
          if-no-files-found: error

  create-release:
    name: Create GitHub Release
    needs: build-desktop
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows
          path: release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: release-assets/*.exe
          generate_release_notes: true
