name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Contract Check diffs the branch against its merge base.  The default
          # shallow clone has no base ref, which is what made the check a no-op
          # in CI: with nothing to compare against it reported CLEAR every run.
          fetch-depth: 0

      # No `version:` here on purpose — action-setup reads the `packageManager`
      # field in package.json, so CI always uses the same pnpm that generated
      # the lockfile.  Pinning a version here as well would let the two drift.
      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict Contract Check
        run: pnpm contract:check:strict

      - name: Build all packages
        run: pnpm --filter './packages/**' build

      - name: Build apps (non-Electron)
        run: pnpm --filter @clawde/runner build

      # Covers every workspace package, including apps/desktop, and is allowed
      # to fail the build.  This step used to end in `2>/dev/null || true`,
      # which discarded the output and the exit code, so it could never fail.
      - name: Typecheck all workspaces
        run: pnpm -r exec tsc --noEmit

      # `pnpm -r` only reaches workspace packages, and scripts/ is not one, so
      # nothing here was ever typechecked — tsx strips the types at runtime
      # without checking them.  That left contract-check.ts, the gate guarding
      # every architecture-sensitive change, with less coverage than the code it
      # guards.
      - name: Typecheck scripts
        run: pnpm typecheck:scripts

      # `pnpm -r --if-present` discovers packages instead of listing them, so a
      # new workspace package is covered the moment it lands.  The previous
      # hardcoded list had already silently missed pappy-eval and
      # agent-loop-core.
      - name: Run tests
        run: pnpm -r --if-present test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Full tree, not --prod.
      #
      # This was scoped to --prod because a full-tree audit could not pass:
      # electron-builder pulls minimatch -> brace-expansion@2, whose fix only
      # existed in 5.x.  Raised overrides have since resolved that, and the full
      # tree now passes at both high and moderate.
      #
      # The scoping had a hole worth naming, because "devDependency" and "does
      # not ship" are not the same claim.  Electron is declared in
      # apps/desktop devDependencies — correct, electron-builder needs it at
      # build time — so pnpm scoped it as dev and --prod skipped it entirely.
      # But Electron *is* the runtime inside the packaged EXE: 15 advisories
      # (3 high) sat against the shipped 39.8.5 while this gate reported clean.
      # Dependabot caught them; CI did not.
      #
      # If a packaging-only advisory ever blocks this again, prefer ignoring
      # that specific CVE via pnpm.auditConfig.ignoreCves over re-scoping the
      # whole gate — an explicit, reviewable exception rather than a silent
      # blind spot.
      - name: Audit dependencies
        run: pnpm audit --audit-level high

      # workbench-core is vendored with its own package-lock.json, so it does not
      # inherit the root pnpm overrides and the pnpm audit above cannot see it.
      # That blind spot let a high-severity postcss advisory sit unreported, so
      # the second lockfile gets its own gate.  --no-workspaces stops npm from
      # trying to resolve the repo's `workspace:*` specifiers, which it cannot
      # parse.
      - name: Audit workbench-core lockfile
        working-directory: packages/workbench-core
        run: npm audit --no-workspaces --audit-level high
