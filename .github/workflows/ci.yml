name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # No `version:` here on purpose — action-setup reads the `packageManager`
      # field in package.json, so CI always uses the same pnpm that generated
      # the lockfile.  Pinning a version here as well would let the two drift.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Expose Node.js headers for native add-ons
        # node-gyp (used by better-sqlite3) tries to download Node headers from
        # nodejs.org, which times out in restricted CI runners.  The headers are
        # already on disk because actions/setup-node installs them.  Setting
        # npm_config_nodedir to the Node prefix tells node-gyp to use those
        # local headers instead of fetching them over the network.
        run: echo "npm_config_nodedir=$(dirname $(dirname $(which node)))" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run strict Contract Check
        run: pnpm contract:check:strict

      - name: Build all packages
        run: pnpm --filter './packages/**' build

      - name: Build apps (non-Electron)
        run: pnpm --filter @clawde/runner build

      # Covers every workspace package, including apps/desktop, and is allowed
      # to fail the build.  This step used to end in `2>/dev/null || true`,
      # which discarded the output and the exit code, so it could never fail.
      - name: Typecheck all workspaces
        run: pnpm -r exec tsc --noEmit

      # `pnpm -r --if-present` discovers packages instead of listing them, so a
      # new workspace package is covered the moment it lands.  The previous
      # hardcoded list had already silently missed pappy-eval and
      # agent-loop-core.
      - name: Run tests
        run: pnpm -r --if-present test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: pnpm

      - name: Expose Node.js headers for native add-ons
        run: echo "npm_config_nodedir=$(dirname $(dirname $(which node)))" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Scoped to production dependencies on purpose.  A full-tree audit
      # currently cannot pass: electron-builder pulls minimatch ->
      # brace-expansion@2, and the fix for the outstanding brace-expansion
      # advisory only exists in 5.x, which minimatch does not accept.  Those
      # packages are devDependencies used at packaging time and never ship.
      # Dependabot still reports the full tree, so nothing is hidden here —
      # this gate blocks what actually reaches users.
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level high
