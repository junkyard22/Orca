name: CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master, dev]

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x, 22.x]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Expose Node.js headers for native add-ons
        # node-gyp (used by better-sqlite3) tries to download Node headers from
        # nodejs.org, which times out in restricted CI runners.  The headers are
        # already on disk because actions/setup-node installs them.  Setting
        # npm_config_nodedir to the Node prefix tells node-gyp to use those
        # local headers instead of fetching them over the network.
        run: echo "npm_config_nodedir=$(dirname $(dirname $(which node)))" >> $GITHUB_ENV

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build all packages
        run: pnpm --filter './packages/**' build

      - name: Build apps (non-Electron)
        run: pnpm --filter @clawde/runner build

      - name: Typecheck all packages
        run: pnpm --filter './packages/**' exec tsc --noEmit 2>/dev/null || true

      - name: Run tests
        run: |
          pnpm --filter @clawde/benson-core test
          pnpm --filter @clawde/dewey-core test
          pnpm --filter @clawde/miranda-core test
          pnpm --filter @clawde/orca-core test
          pnpm --filter @clawde/pappy-core test
          pnpm --filter maestro-core test
          pnpm --filter @yakstacks/workbench-core test
          pnpm --filter @clawde/ext-docs test
          pnpm --filter @clawde/ext-github test
          pnpm --filter @clawde/ext-web test
          pnpm --filter @clawde/runner test
          pnpm --filter @clawde/desktop test
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY || '' }}
