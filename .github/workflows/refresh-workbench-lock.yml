name: Refresh workbench nanoid lockfile

on:
  push:
    branches:
      - security/nanoid-3.3.17

permissions:
  contents: write

jobs:
  refresh-workbench-lockfile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: security/nanoid-3.3.17

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x

      - name: Refresh workbench lockfile
        working-directory: packages/workbench-core
        run: npm install --package-lock-only

      - name: Verify workbench high-severity audit is clear
        working-directory: packages/workbench-core
        run: npm audit --no-workspaces --audit-level high

      - name: Create detached fix commit object
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BASE_SHA="$(git rev-parse HEAD)"
          BASE_TREE="$(git show -s --format=%T "$BASE_SHA")"

          BLOB_SHA="$(jq -Rs '{content: ., encoding: "utf-8"}' < packages/workbench-core/package-lock.json | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/blobs" --input - --jq .sha)"

          TREE_SHA="$(jq -n \
            --arg base "$BASE_TREE" \
            --arg blob "$BLOB_SHA" \
            '{base_tree:$base,tree:[{path:"packages/workbench-core/package-lock.json",mode:"100644",type:"blob",sha:$blob},{path:".github/workflows/refresh-workbench-lock.yml",mode:"100644",type:"blob",sha:null}]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/trees" --input - --jq .sha)"

          COMMIT_SHA="$(jq -n \
            --arg message "fix(deps): refresh workbench nanoid lockfile" \
            --arg tree "$TREE_SHA" \
            --arg parent "$BASE_SHA" \
            '{message:$message,tree:$tree,parents:[$parent]}' \
            | gh api --method POST "repos/${GITHUB_REPOSITORY}/git/commits" --input - --jq .sha)"

          echo "GENERATED_COMMIT_SHA=$COMMIT_SHA"
