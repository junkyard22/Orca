<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self'">
  <title>Orca</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
<div id="app">

  <!-- ── Title bar ─────────────────────────────────────────────────── -->
  <div id="titlebar">
    <div class="brand">
      <div class="brand-dot"></div>
      <span class="brand-name">Orca</span>
    </div>
    <div class="win-controls">
      <button class="win-btn" id="btn-minimize" title="Minimize">
        <svg width="11" height="2" viewBox="0 0 11 2" fill="none">
          <path d="M1 1h9" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
      <button class="win-btn close" id="btn-close" title="Close">
        <svg width="11" height="11" viewBox="0 0 11 11" fill="none">
          <path d="M1 1l9 9M10 1L1 10" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>
    </div>
  </div>

  <!-- ── Content area ───────────────────────────────────────────────── -->
  <div id="content">

    <!-- Welcome (shown when chat is empty) -->
    <div id="welcome">
      <div class="welcome-glyph">
        <svg width="48" height="48" viewBox="0 0 48 48" fill="none">
          <circle cx="24" cy="24" r="22" stroke="#10b981" stroke-width="2"/>
          <path d="M13 28c2-4 5-7 11-7s9 3 11 7" stroke="#10b981" stroke-width="2.2"
                stroke-linecap="round"/>
          <circle cx="18" cy="20" r="2.5" fill="#10b981"/>
          <circle cx="30" cy="20" r="2.5" fill="#10b981"/>
        </svg>
      </div>
      <p class="welcome-title">How can Orca help?</p>
      <p class="welcome-sub">Plan, generate, and quality-check — all in one pass.</p>
    </div>

    <!-- Message feed -->
    <div id="messages"></div>

  </div>

  <!-- ── Status bar ─────────────────────────────────────────────────── -->
  <div id="statusbar">
    <div class="status-dot" id="status-dot"></div>
    <span id="status-text">ready</span>
  </div>

  <!-- ── Input area ─────────────────────────────────────────────────── -->
  <div id="input-wrap">
    <textarea id="input" placeholder="Ask Orca anything…" rows="1"></textarea>
    <button id="send-btn" title="Send  (Enter)">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none">
        <path d="M8 13V3M3 8l5-5 5 5"
              stroke="currentColor" stroke-width="2"
              stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </button>
  </div>

</div>
<script src="app.js"></script>
</body>
</html>
